<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>LuckyDemo — Play-Money Casino</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="demo-banner">🎲 DEMO — play credits only, no real money, no cash value</div>
<header id="topbar" class="topbar hidden">
  <a href="#/" class="logo">Lucky<span>Demo</span></a>
  <div class="wallet">
    <button class="currency" id="currencyBtn" title="Play credits">
      <span class="cur-label"><span id="curCode">CRD</span> ▾</span>
      <span class="bal" id="balance">0.00</span>
    </button>
    <button class="btn-deposit" id="depositBtn">Deposit</button>
    <button class="bell" id="bellBtn" aria-label="Notifications">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1Z"/></svg>
      <span class="dot hidden" id="bellDot"></span>
    </button>
  </div>
</header>
<div id="notifPanel" class="notif-panel hidden"></div>
<main id="app"></main>
<nav id="bottomnav" class="bottomnav hidden">
  <a href="#/" data-r="home">🏠<span>Home</span></a>
  <a href="#/games" data-r="games">🎮<span>Games</span></a>
  <a href="#/history" data-r="history">🧾<span>History</span></a>
  <a href="#/profile" data-r="profile">👤<span>Profile</span></a>
</nav>
<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
